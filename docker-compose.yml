version: '3.8'

services:
  netguard:
    build: .
    container_name: netguard-sensor
    restart: unless-stopped
    # host network mode is required for Layer 2 ARP broadcast frame capture
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./security.db:/app/security.db
    environment:
      - PYTHONUNBUFFERED=1
